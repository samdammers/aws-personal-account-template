name: Terraform

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Format check
        run: terraform fmt -check -recursive

      # No backend, no AWS/Auth0 credentials needed for validate - it only
      # checks syntax and internal consistency against provider schemas.
      - name: Init
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

      - name: Set up tflint
        uses: terraform-linters/setup-tflint@v4

      - name: Lint
        run: tflint --init && tflint
